<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefones</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h1>Telefones</h1>

        <form id="numberForm">
        <input type="text" id="number" placeholder="Telefone" required maxlength="11"/>

            <select id="personId" required>
                <option value="">Selecione a pessoa</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>

        <ul id="numberList"></ul>
    </div>

    <script type="module" src="../scripts/numberPhone.script.js" defer></script>
</body>
</html>
