<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h1>Pessoas</h1>

        <form id="personForm">
            <input type="text" id="name" placeholder="Nome" required/>
            <button type="submit">Cadastrar</button>
        </form>
        <h2>Buscar pessoa por ID</h2>
        <input type="number" id="searchId" placeholder="ID da Pessoa">
        <button id="searcBtn">Buscar</button>

        <div id="personDetails"></div>

        <ul id="personList"></ul>
    </div>

    <script type="module" src="../scripts/person.script.js" defer></script>
</body>
</html>
