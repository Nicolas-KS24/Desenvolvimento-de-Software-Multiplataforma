<DOCTYPE html>
<html lang="pt-BR">
    <head>
      <meta charset="utf-8" />
      <title>Exercício 7</title>
    </head>
    <body>
      <form>
        <fieldset>
          <legend>Dia</legend>
            <div>
                <input type="checkbox" name="Dia" id="um" value="Domingo" />
                <label for="um">Domingo</label>
            </div>
            <div>
                <input type="checkbox" name="Dia" id="dois" value="Segunda-feira" checked />
                <label for="dois">Segunda-feira</label>
            </div>
            <div>
                <input type="checkbox" name="Dia" id="tres" value="Terça-feira" />
                <label for="tres">Terça-feira</label>
            </div>
            <div>
                <input type="checkbox" name="Dia" id="quatro" value="Quarta-feira" />
                <label for="quatro">Quarta-feira</label>
            </div>
            <div>
                <input type="checkbox" name="Dia" id="cinco" value="Quinta-feira" checked />
                <label for="cinco">Quinta-feira</label>
            </div>
            <div>
                <input type="checkbox" name="Dia" id="seis" value="Sexta-feira" />
                <label for="seis">Sexta-feira</label>
            </div>
            <div>
                <input type="checkbox" name="Dia" id="sete" value="Sábado" />
                <label for="sete">Sábado</label>
            </div>
        </fieldset>
        <button>Enviar</button>
      </form>
    </body>
</html>
