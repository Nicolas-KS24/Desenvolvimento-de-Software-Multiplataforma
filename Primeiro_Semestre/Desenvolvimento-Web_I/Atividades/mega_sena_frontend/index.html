
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atividade 2</title>
    <link href="./styles/index.css" rel="stylesheet" type="text/css" />
    <script src="./js/index.js"></script>
  </head>
  <body onload="load()">
    <div id="header">Mega-Sena</div>
    <div id="container">
      <div id="title-row">
        <div id="title-left">
          <div id="title-resultado">Resultado</div>
          <div id="title-concurso">Concurso</div>
        </div>
        <div id="title-right">
          <label id="search-label" for="search-input">Buscar por concurso</label>
          <input id="search-input" placeholder="Ex: 1475" onkeydown="if (event.key === 'Enter') load(this.value)" />
          <div id="prior" onclick="if(result){load(result.concurso-1)}">&lsaquo; Anterior</div>
          <div id="next" onclick="if(result){load(result.concurso+1)}">Próximo &rsaquo;</div>
        </div>
      </div>
      <div id="body-row">
        <div id="body-left">
          <h2 id="acumulou">Acumulou!</h2>
          <div id="local"></div>
          <div id="row-balls">
            <div class="ball" id="bola1"></div>
            <div class="ball" id="bola2"></div>
            <div class="ball" id="bola3"></div>
            <div class="ball" id="bola4"></div>
            <div class="ball" id="bola5"></div>
            <div class="ball" id="bola6"></div>
          </div>
          <div id="row-estimativa">
            <div id="estimativa-text">Estimativa de prêmio do próximo concurso</div>
            <div id="estimativa-premio"></div>
          </div>
          <div class="row-acumulado">
            <div class="acumulado-text">Acumulado próximo concurso</div>
            <div class="acumulado-valor" id="acumulado-6-acertos"></div>
          </div>
          <div class="row-acumulado">
            <div class="acumulado-text">Acumulado para Sorteio Especial Mega da Virada</div>
            <div class="acumulado-valor" id="acumulado-sorteio-especial-mega-da-virada"></div>
          </div>
        </div>
        <div id="body-right">
          <div id="body-right-container">
            <h2 class="titulo-item">Premiação</h2>
            <div class="row-acerto"><div class="acerto-dezena">6 acertos</div><div id="ganhadores-6-acertos"></div></div>
            <div class="row-acerto"><div class="acerto-dezena">5 acertos</div><div id="ganhadores-5-acertos"></div></div>
            <div class="row-acerto"><div class="acerto-dezena">4 acertos</div><div id="ganhadores-4-acertos"></div></div>
            <h2 class="titulo-item">Detalhamento</h2>
            <div id="cidade-uf"></div>
            <h2 class="titulo-item">Arrecadação total</h2>
            <div id="arrecadacao-total"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
